<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Archive — Quigley Discovery</title>
<meta name="description" content="Every week of Quigley Discovery picks: independent artists worth your ears.">
<meta name="theme-color" content="#2F5D3A">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Quigley Discovery">
<meta property="og:title" content="The Archive — Quigley Discovery">
<meta property="og:description" content="Every week of Quigley Discovery picks: independent artists worth your ears.">
<meta property="og:url" content="https://www.quigleydiscovery.com/archive.html">
<meta property="og:image" content="https://www.quigleydiscovery.com/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Quigley Discovery: a white Q on a green circle">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://www.quigleydiscovery.com/og-image.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/styles.css">
<style>
  /* ---- Archive page ("See Previous Weeks") ---- */
  .ar-hero { padding-top: 64px; padding-bottom: 8px; }
  .ar-eyebrow { font-size: 15px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #4F9130; margin: 0 0 10px 0; }
  .ar-title { font-family: 'Sorean', serif; font-size: clamp(40px, 6vw, 68px); line-height: 1.05; color: var(--heading); margin: 0 0 14px 0; }
  .ar-sub { font-size: 19px; line-height: 1.6; color: var(--muted); margin: 0; max-width: 620px; }

  .ar-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; margin: 32px 0 8px 0; }
  .ar-stat { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px 20px; }
  .ar-stat b { display: block; font-family: 'Archivo Black', sans-serif; font-size: 32px; color: var(--accent); line-height: 1.1; }
  .ar-stat span { font-size: 14px; color: var(--muted); }

  .ar-controls { position: sticky; top: 66px; z-index: 5; background: rgba(245,239,220,0.92); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); margin-top: 24px; }
  .ar-controls .wrap { padding-top: 14px; padding-bottom: 14px; display: flex; flex-direction: column; gap: 12px; }
  .ar-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .ar-label { font-size: 12px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); min-width: 64px; }

  .step { width: 38px; height: 38px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--accent); font-size: 18px; font-weight: 800; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; font-family: inherit; }
  .step:disabled { opacity: 0.35; cursor: default; }
  .step:not(:disabled):hover { background: var(--accent); color: #FFFBF1; }
  .week-rail { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; flex: 1; min-width: 0; padding: 2px; }
  .week-rail::-webkit-scrollbar { display: none; }
  .week-chip { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 999px; padding: 8px 14px; font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit; white-space: nowrap; }
  .week-chip .num { font-family: 'Archivo Black', sans-serif; color: var(--accent); }
  .week-chip .now { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em; color: #FFFBF1; background: #4F9130; padding: 2px 7px; border-radius: 999px; }
  .week-chip[aria-pressed="true"] { background: var(--accent); color: #FFFBF1; border-color: var(--accent); }
  .week-chip[aria-pressed="true"] .num { color: #FFD54A; }

  .genre-chip { border: 2px solid transparent; border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; cursor: pointer; font-family: inherit; color: #FFFBF1; opacity: 0.9; transition: opacity .15s, transform .15s, box-shadow .15s; }
  .genre-chip:hover { opacity: 1; }
  .genre-chip[aria-pressed="true"] { opacity: 1; border-color: #8FAE7C; transform: translateY(-1px); box-shadow: 0 3px 10px rgba(0,0,0,0.18); }
  .genre-chip.all { background: var(--ink); }
  .surprise { margin-left: auto; display: inline-flex; align-items: center; gap: 8px; border: none; border-radius: 999px; padding: 9px 16px; background: #FFD54A; color: var(--ink); font-size: 14px; font-weight: 800; cursor: pointer; font-family: inherit; }
  .surprise:hover { filter: brightness(0.96); }

  .ar-body { padding-top: 36px; padding-bottom: 72px; min-height: 50vh; }
  .ar-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
  .ar-head h2 { font-family: 'Sorean', serif; font-size: clamp(28px, 4vw, 40px); color: var(--heading); margin: 0; }
  .ar-head .meta { font-size: 15px; color: var(--muted); }
  .fade-in { animation: arFade .35s ease both; }
  @keyframes arFade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  /* Featured pick of a week */
  .ar-feature { position: relative; border-radius: 20px; overflow: hidden; border: 2px solid var(--accent); margin-bottom: 20px; min-height: 300px; display: flex; }
  .ar-feature .inner { position: relative; z-index: 1; padding: 36px; display: flex; flex-direction: column; gap: 12px; justify-content: flex-end; max-width: 720px; }
  .ar-feature .name { font-size: clamp(44px, 7vw, 64px); color: #FFFBF1; margin: 0; line-height: 1.05; }
  .ar-feature .bio { color: #E9E3CC; font-size: 17px; line-height: 1.6; margin: 0; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

  /* The rest of a week's picks */
  .ar-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(240px, 100%), 1fr)); gap: 18px; }
  .ar-card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; transition: transform .15s, box-shadow .15s; }
  .ar-card:hover { transform: translateY(-3px); box-shadow: 0 10px 24px rgba(44,52,32,0.12); }
  .ar-card .photo { position: relative; aspect-ratio: 4 / 3; background: #2C3420; overflow: hidden; }
  .ar-card .photo img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .4s; }
  .ar-card:hover .photo img { transform: scale(1.04); }
  .ar-card .photo .tag { position: absolute; left: 12px; bottom: 12px; }
  .ar-card .drop-label { position: absolute; right: 10px; top: 10px; font-size: 11px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: #FFFBF1; background: rgba(10,12,8,0.6); padding: 4px 8px; border-radius: 999px; }
  .ar-card .body { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .ar-card .name { font-size: 28px; margin: 0; color: var(--ink); line-height: 1.1; }
  .ar-card .bio { font-size: 15px; line-height: 1.55; color: var(--muted); margin: 0; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .ar-card .links { margin-top: auto; padding-top: 6px; display: flex; gap: 8px; flex-wrap: wrap; }
  .pill { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; padding: 8px 14px; border-radius: 999px; white-space: nowrap; }
  .pill.listen { color: #FFFBF1; background: var(--accent); }
  .pill.profile { color: var(--accent); background: rgba(143,174,122,0.22); }
  .ar-feature .pill.profile { color: #FFFBF1; background: rgba(255,251,241,0.16); }
  .spotlight { animation: arPulse 1.6s ease 2; }
  @keyframes arPulse { 0%,100% { box-shadow: 0 0 0 0 rgba(255,213,74,0); } 40% { box-shadow: 0 0 0 6px rgba(255,213,74,0.9); } }

  .ar-note { margin-top: 28px; background: var(--card); border: 1px dashed rgba(44,52,32,0.25); border-radius: 14px; padding: 16px 20px; font-size: 15px; color: var(--muted); }
  .ar-note b { color: var(--ink); }
</style>
</head>
<body>
<div style="position: relative; overflow-x: clip;">
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>

  <div class="nav">
    <div class="wrap nav-inner">
      <a href="/" class="brand"><span class="light">Quigley</span>&nbsp;<span class="accent">Discovery</span></a>
      <a href="/#picks" style="font-size: 16px; font-weight: 700; color: var(--accent);">← This week's artists</a>
    </div>
  </div>

  <div class="wrap ar-hero">
    <p class="ar-eyebrow">The Archive</p>
    <h1 class="ar-title">Every drop, in order.</h1>
    <p class="ar-sub">I find artists before the labels do. Step through past weeks, filter by sound, or let the archive pick someone for you.</p>
    <div class="ar-stats" id="ar-stats"></div>
  </div>

  <div class="ar-controls">
    <div class="wrap">
      <div class="ar-row">
        <span class="ar-label">Week</span>
        <button class="step" id="prev-week" type="button" aria-label="Older week" title="Older week (←)">‹</button>
        <div class="week-rail" id="week-rail" role="group" aria-label="Weeks"></div>
        <button class="step" id="next-week" type="button" aria-label="Newer week" title="Newer week (→)">›</button>
      </div>
      <div class="ar-row" id="genre-row">
        <span class="ar-label">Sound</span>
      </div>
    </div>
  </div>

  <div class="wrap ar-body" id="ar-body">
    <p class="loading">Loading the archive…</p>
  </div>
</div>

<script>
// "See Previous Weeks": every published week, from /api/weeks + /api/artists.
// Two views: a single week (stepper / rail / ← →) or a genre across all weeks.
(function () {
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => (
    { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  let weeks = [];          // newest first: [{ week_of, num, label, short, artists }]
  let state = { week: null, genre: null };

  function weekLabel(iso) {
    const d = new Date(iso + "T12:00:00");
    return "Week of " + d.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
  }
  function shortDate(iso) {
    return new Date(iso + "T12:00:00").toLocaleDateString("en-US", { month: "short", day: "numeric" });
  }
  const dropNum = (n) => String(n).padStart(2, "0");

  // ---------- rendering pieces ----------
  function tag(a) {
    return `<span class="tag solid" style="background:${esc(a.tag_color)};">${esc(a.tag)}</span>`;
  }
  function links(a) {
    const listen = a.spotify_url
      ? `<a class="pill listen" href="${esc(a.spotify_url)}" target="_blank" rel="noopener"><svg width="10" height="10" viewBox="0 0 24 24" fill="#FFFBF1"><path d="M8 5v14l11-7z"></path></svg>Listen</a>` : "";
    const profile = a.profile_href ? `<a class="pill profile" href="${esc(a.profile_href)}">Full profile →</a>` : "";
    return listen + profile;
  }
  function featureCard(a) {
    const bg = a.has_card_photo
      ? `<div class="card-bg"><img src="${esc(a.card_photo)}" alt=""><div class="overlay"></div></div>` : "";
    return `
      <div class="ar-feature card-dark" data-slug="${esc(a.slug)}">
        ${bg}
        <div class="inner">
          <div style="display:flex; gap:8px; flex-wrap:wrap;">
            <span class="tag featured-tag">Featured Pick</span>${tag(a)}
          </div>
          <h3 class="name" style="font-family:${a.title_font};">${a.profile_href ? `<a class="name-link" href="${esc(a.profile_href)}" title="${esc(a.name)}'s full profile">${esc(a.name)}</a>` : esc(a.name)}</h3>
          <p class="bio">${esc(a.bio)}</p>
          <div style="display:flex; gap:8px; flex-wrap:wrap;">${links(a)}</div>
        </div>
      </div>`;
  }
  function card(a, dropText) {
    const img = a.has_card_photo ? `<img src="${esc(a.card_photo)}" alt="${esc(a.name)}" loading="lazy">` : "";
    return `
      <div class="ar-card" data-slug="${esc(a.slug)}">
        <div class="photo">${img}${tag(a)}${dropText ? `<span class="drop-label">${esc(dropText)}</span>` : ""}</div>
        <div class="body">
          <h3 class="name" style="font-family:${a.title_font};">${a.profile_href ? `<a class="name-link" href="${esc(a.profile_href)}" title="${esc(a.name)}'s full profile">${esc(a.name)}</a>` : esc(a.name)}</h3>
          <p class="bio">${esc(a.bio)}</p>
          <div class="links">${links(a)}</div>
        </div>
      </div>`;
  }

  // ---------- views ----------
  function renderWeek() {
    const w = weeks.find((x) => x.week_of === state.week) || weeks[0];
    const featured = w.artists.find((a) => a.is_featured) || w.artists[0];
    const rest = w.artists.filter((a) => a !== featured);
    const isLatest = w === weeks[0];
    const note = weeks.length === 1
      ? `<div class="ar-note"><b>Drop ${dropNum(w.num)} is the first one.</b> Each time a new week goes up, the last one lands here, so the archive grows every week.</div>`
      : "";
    $("ar-body").innerHTML = `
      <div class="fade-in">
        <div class="ar-head">
          <h2>Drop ${dropNum(w.num)} · ${esc(w.label)}</h2>
          <span class="meta">${w.artists.length} artists${isLatest ? " · this week's drop" : ""}</span>
        </div>
        ${featured ? featureCard(featured) : ""}
        <div class="ar-grid">${rest.map((a) => card(a)).join("")}</div>
        ${note}
      </div>`;
  }

  function renderGenre() {
    const hits = [];
    weeks.forEach((w) => w.artists.forEach((a) => { if (a.tag === state.genre) hits.push({ a, w }); }));
    const dropsHit = new Set(hits.map((h) => h.w.week_of)).size;
    $("ar-body").innerHTML = `
      <div class="fade-in">
        <div class="ar-head">
          <h2>${esc(state.genre)}</h2>
          <span class="meta">${hits.length} artist${hits.length === 1 ? "" : "s"} across ${dropsHit} drop${dropsHit === 1 ? "" : "s"}</span>
        </div>
        <div class="ar-grid">${hits.map(({ a, w }) => card(a, `Drop ${dropNum(w.num)} · ${w.short}`)).join("")}</div>
      </div>`;
  }

  function render() {
    // Week rail + steppers
    $("week-rail").querySelectorAll(".week-chip").forEach((b) =>
      b.setAttribute("aria-pressed", String(!state.genre && b.dataset.week === state.week)));
    const i = weeks.findIndex((w) => w.week_of === state.week);
    $("prev-week").disabled = !!state.genre ? false : i >= weeks.length - 1;
    $("next-week").disabled = !!state.genre ? false : i <= 0;
    // Genre chips
    document.querySelectorAll(".genre-chip").forEach((b) =>
      b.setAttribute("aria-pressed", String((b.dataset.genre || null) === state.genre)));
    // Body
    state.genre ? renderGenre() : renderWeek();
    // Shareable URL
    const hash = state.genre ? "genre=" + encodeURIComponent(state.genre) : "week=" + state.week;
    history.replaceState(null, "", "#" + hash);
    const active = $("week-rail").querySelector('[aria-pressed="true"]');
    if (active) active.scrollIntoView({ block: "nearest", inline: "center", behavior: "smooth" });
  }

  function goWeek(week) { state = { week, genre: null }; render(); }
  function step(dir) { // dir: +1 = older, -1 = newer
    const i = weeks.findIndex((w) => w.week_of === state.week);
    const j = state.genre ? i : Math.min(weeks.length - 1, Math.max(0, i + dir));
    goWeek(weeks[j].week_of);
  }

  function surprise() {
    const all = [];
    weeks.forEach((w) => w.artists.forEach((a) => all.push({ a, w })));
    const pick = all[Math.floor(Math.random() * all.length)];
    goWeek(pick.w.week_of);
    requestAnimationFrame(() => {
      const el = document.querySelector(`[data-slug="${CSS.escape(pick.a.slug)}"]`);
      if (!el) return;
      el.scrollIntoView({ block: "center", behavior: "smooth" });
      el.classList.remove("spotlight"); void el.offsetWidth; el.classList.add("spotlight");
    });
  }

  // ---------- boot ----------
  async function load() {
    try {
      const wl = (await (await fetch("/api/weeks")).json()).weeks || [];
      const lists = await Promise.all(wl.map((w) =>
        fetch("/api/artists?week=" + encodeURIComponent(w)).then((r) => r.json())));
      weeks = wl.map((w, i) => ({
        week_of: w,
        num: wl.length - i,            // oldest week is Drop 01
        label: weekLabel(w),
        short: shortDate(w),
        artists: lists[i].artists || [],
      })).filter((w) => w.artists.length);
      if (!weeks.length) { $("ar-body").innerHTML = `<p class="loading">No drops yet.</p>`; return; }

      // Stats strip
      const artists = weeks.flatMap((w) => w.artists);
      const genres = [...new Map(artists.map((a) => [a.tag, a.tag_color])).entries()];
      $("ar-stats").innerHTML = [
        [weeks.length, weeks.length === 1 ? "drop so far" : "drops so far"],
        [artists.length, "independent artists featured"],
        [genres.length, "different sounds"],
        [0, "signed to a label (so far)"],
      ].map(([n, t]) => `<div class="ar-stat"><b>${n}</b><span>${t}</span></div>`).join("");

      // Week rail
      $("week-rail").innerHTML = weeks.map((w, i) => `
        <button type="button" class="week-chip" data-week="${w.week_of}">
          <span class="num">${dropNum(w.num)}</span>${esc(w.short)}${i === 0 ? '<span class="now">This week</span>' : ""}
        </button>`).join("");
      $("week-rail").addEventListener("click", (e) => {
        const b = e.target.closest(".week-chip"); if (b) goWeek(b.dataset.week);
      });

      // Genre chips + surprise
      const row = $("genre-row");
      row.insertAdjacentHTML("beforeend",
        `<button type="button" class="genre-chip all" data-genre="">All</button>` +
        genres.map(([g, c]) => `<button type="button" class="genre-chip" data-genre="${esc(g)}" style="background:${esc(c)};">${esc(g)}</button>`).join("") +
        `<button type="button" class="surprise" id="surprise"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="4"></rect><circle cx="8.5" cy="8.5" r="1.2" fill="currentColor"></circle><circle cx="15.5" cy="15.5" r="1.2" fill="currentColor"></circle><circle cx="12" cy="12" r="1.2" fill="currentColor"></circle></svg>Surprise me</button>`);
      row.addEventListener("click", (e) => {
        const g = e.target.closest(".genre-chip");
        if (g) { state = g.dataset.genre ? { week: state.week, genre: g.dataset.genre } : { week: state.week, genre: null }; render(); }
        if (e.target.closest("#surprise")) surprise();
      });
      $("prev-week").addEventListener("click", () => step(+1));
      $("next-week").addEventListener("click", () => step(-1));
      document.addEventListener("keydown", (e) => {
        if (e.target.closest && e.target.closest("input, textarea, select")) return;
        if (e.key === "ArrowLeft") step(+1);
        if (e.key === "ArrowRight") step(-1);
      });

      // Initial state from the URL (#week=YYYY-MM-DD or #genre=...)
      const h = new URLSearchParams(location.hash.slice(1));
      const wantWeek = h.get("week");
      state.week = weeks.some((w) => w.week_of === wantWeek) ? wantWeek : weeks[0].week_of;
      state.genre = h.get("genre") && genres.some(([g]) => g === h.get("genre")) ? h.get("genre") : null;
      render();
    } catch (e) {
      $("ar-body").innerHTML = `<p class="loading">Couldn't load the archive. Is the server running?</p>`;
    }
  }
  load();
})();
</script>
</body>
</html>
