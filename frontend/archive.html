<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Previous Weeks — Quigley Discovery</title>
<meta name="description" content="Every week of Quigley Discovery picks: independent artists worth your ears.">
<meta name="theme-color" content="#2F5D3A">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Quigley Discovery">
<meta property="og:title" content="Previous Weeks — Quigley Discovery">
<meta property="og:description" content="Every week of Quigley Discovery picks: independent artists worth your ears.">
<meta property="og:url" content="https://www.quigleydiscovery.com/archive.html">
<meta property="og:image" content="https://www.quigleydiscovery.com/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Quigley Discovery: a white Q on a green circle">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://www.quigleydiscovery.com/og-image.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/styles.css">
<style>
  /* ---- Archive page ("See Previous Weeks"): a plain list, newest week first ---- */
  .ar-hero { padding-top: 64px; padding-bottom: 8px; }
  .ar-title { font-family: 'Sorean', serif; font-size: clamp(40px, 6vw, 64px); line-height: 1.05; color: var(--heading); margin: 0 0 12px 0; }
  .ar-sub { font-size: 18px; line-height: 1.6; color: var(--muted); margin: 0; max-width: 560px; }

  .ar-filter { margin-top: 28px; display: flex; align-items: center; gap: 10px; font-size: 15px; color: var(--muted); }
  .ar-filter select { font: inherit; font-weight: 600; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; cursor: pointer; }

  .ar-body { padding-top: 24px; padding-bottom: 80px; min-height: 40vh; }
  .ar-week { margin-top: 40px; scroll-margin-top: 90px; }
  .ar-week h2 { font-family: 'Sorean', serif; font-size: clamp(24px, 3vw, 30px); color: var(--heading); margin: 0 0 4px 0; }

  .ar-list { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
  .ar-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 24px; align-items: center; padding: 20px 0; border-bottom: 1px solid var(--line); }
  .ar-name { margin: 0; font-size: 30px; line-height: 1.1; color: var(--ink); }
  .ar-meta { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 12px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-top: 6px; }
  .ar-top { color: #B8860B; }
  .ar-links { display: flex; gap: 18px; font-size: 15px; font-weight: 700; white-space: nowrap; }
  .ar-links a { color: var(--accent); }
  .ar-empty { color: var(--muted); font-size: 16px; padding: 24px 0; }

  @media (max-width: 560px) {
    .ar-row { grid-template-columns: 1fr; }
    .ar-name { font-size: 26px; }
    .ar-links { order: 3; }
  }
</style>
</head>
<body>
<div style="position: relative; overflow-x: clip;">
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>

  <div class="nav">
    <div class="wrap nav-inner">
      <a href="/" class="brand"><span class="light">Quigley</span>&nbsp;<span class="accent">Discovery</span></a>
      <a href="/#picks" style="font-size: 16px; font-weight: 700; color: var(--accent);">← This week's artists</a>
    </div>
  </div>

  <div class="wrap ar-hero">
    <h1 class="ar-title">Previous weeks</h1>
    <p class="ar-sub">Every artist I've picked, newest week first.</p>
    <label class="ar-filter" id="ar-filter" hidden>Sound
      <select id="genre"><option value="">All</option></select>
    </label>
  </div>

  <div class="wrap ar-body" id="ar-body">
    <p class="loading">Loading…</p>
  </div>
</div>

<script>
// "See Previous Weeks": every published week, from /api/weeks + /api/artists,
// shown as a simple list (newest first) with an optional genre filter.
(function () {
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => (
    { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const weekLabel = (iso) => "Week of " + new Date(iso + "T12:00:00")
    .toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });

  let weeks = []; // newest first: [{ week_of, artists }]

  function row(a) {
    const name = a.profile_href
      ? `<a class="name-link" href="${esc(a.profile_href)}">${esc(a.name)}</a>` : esc(a.name);
    const listen = a.spotify_url ? `<a href="${esc(a.spotify_url)}" target="_blank" rel="noopener">Listen ↗</a>` : "";
    const profile = a.profile_href ? `<a href="${esc(a.profile_href)}">Profile →</a>` : "";
    return `
      <li class="ar-row">
        <div>
          <h3 class="ar-name" style="font-family:${a.title_font};">${name}</h3>
          <div class="ar-meta">${a.is_featured ? '<span class="ar-top">★ Top pick</span>' : ""}<span>${esc(a.tag)}</span></div>
        </div>
        <div class="ar-links">${listen}${profile}</div>
      </li>`;
  }

  function render() {
    const g = $("genre").value;
    const html = weeks.map((w) => {
      const list = w.artists
        .filter((a) => !g || a.tag === g)
        .sort((a, b) => (b.is_featured ? 1 : 0) - (a.is_featured ? 1 : 0));
      if (!list.length) return "";
      return `<section class="ar-week" id="week-${w.week_of}">
        <h2>${esc(weekLabel(w.week_of))}</h2>
        <ul class="ar-list">${list.map(row).join("")}</ul>
      </section>`;
    }).join("");
    $("ar-body").innerHTML = html || `<p class="ar-empty">No artists with that sound yet.</p>`;
    balanceNames();
  }

  // Each artist's name uses a different display font, and the same font-size
  // looks very different from font to font. Size every name so its capital
  // letters come out the same height on screen instead.
  // Measures how tall the name's own letters stand above the baseline, per
  // 1px of font-size, in that name's font.
  async function inkRatio(family, text) {
    try { await document.fonts.load(`100px ${family}`, text); } catch (e) {}
    const ctx = document.createElement("canvas").getContext("2d");
    ctx.font = `100px ${family}`;
    const r = ctx.measureText(text).actualBoundingBoxAscent / 100;
    return r > 0.3 && r < 1.2 ? r : 0.72;
  }
  // Fonts that still look small at the same letter height (thin, narrow or
  // slanted strokes) get a nudge. Tune by eye.
  const OPTICAL = { Adventure: 1.18 };
  async function balanceNames() {
    const target = window.matchMedia("(max-width: 560px)").matches ? 24 : 30; // px of letter height
    for (const el of document.querySelectorAll(".ar-name")) {
      const r = await inkRatio(getComputedStyle(el).fontFamily, el.textContent);
      const fam = getComputedStyle(el).fontFamily.split(",")[0].replace(/["']/g, "").trim();
      el.style.fontSize = (target / r * (OPTICAL[fam] || 1)).toFixed(1) + "px";
    }
  }
  window.matchMedia("(max-width: 560px)").addEventListener("change", balanceNames);

  async function load() {
    try {
      const wl = (await (await fetch("/api/weeks")).json()).weeks || [];
      const lists = await Promise.all(wl.map((w) =>
        fetch("/api/artists?week=" + encodeURIComponent(w)).then((r) => r.json())));
      weeks = wl.map((w, i) => ({ week_of: w, artists: lists[i].artists || [] }))
        .filter((w) => w.artists.length);
      if (!weeks.length) { $("ar-body").innerHTML = `<p class="ar-empty">No weeks yet.</p>`; return; }

      const genres = [...new Set(weeks.flatMap((w) => w.artists.map((a) => a.tag)))].sort();
      if (genres.length > 1) {
        $("genre").insertAdjacentHTML("beforeend", genres.map((t) => `<option>${esc(t)}</option>`).join(""));
        $("ar-filter").hidden = false;
        $("genre").addEventListener("change", render);
      }
      render();

      // Old links like #week=2026-11-16 jump to that week.
      const want = new URLSearchParams(location.hash.slice(1)).get("week");
      if (want && $("week-" + want)) $("week-" + want).scrollIntoView();
    } catch (e) {
      $("ar-body").innerHTML = `<p class="ar-empty">Couldn't load previous weeks.</p>`;
    }
  }
  load();
})();
</script>
</body>
</html>
